<script type="text/javascript">
  function loadLib(url,callback) {
      var script = document.createElement("script");
      script.async = false;
      script.src = url;
      script.addEventListener('load', function () {
          script.parentNode.removeChild(script);
          script.removeEventListener('load', arguments.callee, false);
          callback&&callback();
      }, false);
      document.body.appendChild(script);
  }

<script src="https://sad.adsgram.ai/js/sad.min.js"></script>

<script>
(function () {
    window.Telegram && window.Telegram.WebApp && (
        window.Telegram.WebApp.ready(),
        window.Telegram.WebApp.expand()
    );

    var AdController = null;       // Rewarded ad
    var IntAdController = null;    // Interstitial ad

    // Read ad Block IDs from ID.txt, format: KEY=VALUE, one entry per line
    function loadConfig(cb) {
        fetch('ID.txt?_=' + Date.now())
            .then(function (r) { return r.text(); })
            .then(function (text) {
                var cfg = {};
                text.split('\n').forEach(function (line) {
                    var parts = line.trim().split('=');
                    if (parts.length === 2) cfg[parts[0].trim()] = parts[1].trim();
                });
                cb(cfg);
            })
            .catch(function () { cb({}); });
    }

    function initAds(cfg) {
        if (!window.Adsgram) return;
        var rewardId = cfg['REWARD_BLOCK_ID'] || '';
        var intId    = cfg['INT_BLOCK_ID']    || '';
        try { if (rewardId) AdController    = window.Adsgram.init({ blockId: rewardId }); } catch(e) {}
        try { if (intId)    IntAdController = window.Adsgram.init({ blockId: intId });    } catch(e) {}
    }

    function waitAndInit(cfg) {
        if (window.Adsgram) {
            initAds(cfg);
        } else {
            var sdkCheck = setInterval(function () {
                if (window.Adsgram) { clearInterval(sdkCheck); initAds(cfg); }
            }, 300);
        }
    }

    // Load config first, then initialize ads
    loadConfig(function (cfg) {
        waitAndInit(cfg);
    });

    // ---- Bridge consumed by the game (code.js) ----
    // The game's Platform.playRewardAd / showInterstitialAd call into window.ggmgr,
    // so rewarded & interstitial ads flow through the game's own buttons and logic.
    window.ggmgr = {
        // Rewarded video. cb(true) => grant the in-game reward, cb(false) => skip.
        // If no ad is available (e.g. opened outside Telegram), grant anyway so the
        // player is never blocked — matches the game's built-in fallback.
        xsv: function (cb) {
            if (!AdController) { cb && cb(true); return; }
            AdController.show().then(function () {
                cb && cb(true);
            }).catch(function () {
                cb && cb(false);
            });
        },
        // Interstitial ad. Triggered by the game at settle/transition moments.
        xsi: function () {
            if (!IntAdController) return;
            IntAdController.show().then(function () {}).catch(function () {});
        },
        // Called once on main scene load. Reserved hook (e.g. preload); no-op for now.
        glc: function () {}
    };
})();
</script>
